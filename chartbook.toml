[project]
name = "He-Kelly-Manela Factors"
description = "Intermediary Capital Risk Factors from He, Kelly, and Manela (2017)"
contributors = [
    "Jeremiah Bejarano",
]
repo_url = "https://github.com/ftsfr/he_kelly_manela"
copyright = "2025"
os_compatibility = [
    "Windows",
    "Linux",
    "MacOS",
]
requires_chartbook = ">=0.5.0"

[scripts]
build = "doit"

[notebooks.summary_he_kelly_manela_ipynb]
name = "summary_he_kelly_manela_ipynb"
description = "Summary statistics and visualization of He-Kelly-Manela factor data"
path = "_output/summary_he_kelly_manela_ipynb.ipynb"
publishable = true

[dataframes.ftsfr_he_kelly_manela_factors_monthly]
name = "ftsfr_he_kelly_manela_factors_monthly"
description = "Monthly intermediary capital risk factors from He, Kelly, and Manela (2017)"
sources = [
    "he_kelly_manela",
]
providers = [
    "Asaf Manela",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://asaf.manela.org/papers/hkm/intermediarycapitalrisk/",
]
tags = [
    "factors",
    "intermediary",
    "capital",
]
access_types = [
    "Public",
]
license = "Public"
restrictions = "No"
pull_method = "Downloaded from Asaf Manela's website"
path = "./_data/ftsfr_he_kelly_manela_factors_monthly.parquet"
date_col = "ds"
docs = """
## Monthly Intermediary Capital Risk Factors

This dataset contains monthly observations of the intermediary capital risk factors from He, Kelly, and Manela (2017).

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Factor identifier |
| ds | Date |
| y | Factor value |

### Factors

- `intermediary_capital_ratio`: Capital ratio of primary dealers
- `intermediary_capital_risk_factor`: Innovation in capital ratio (the risk factor)
- `intermediary_value_weighted_investment_return`: Value-weighted investment return
- `intermediary_leverage_ratio_squared`: Squared leverage ratio
"""

